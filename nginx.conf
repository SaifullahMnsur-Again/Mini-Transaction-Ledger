# ================================================================
# NGINX CONFIGURATION - MINI TRANSACTION LEDGER
# ================================================================
# Multi-server capable reverse proxy with SSL/TLS, caching, and
# rate limiting. Optimized for 1GB RAM VM, allows running multiple
# applications by using subdomain/path-based routing.
# ================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ================================================================
# EVENTS BLOCK - Connection handling
# ================================================================
events {
    worker_connections 1024;
    use epoll;  # Use epoll for efficient connection handling on Linux
    multi_accept on;
}

# ================================================================
# HTTP BLOCK - Core settings
# ================================================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # LOGGING CONFIGURATION
    # ============================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    
    # Disable logging for health checks
    map $request_uri $skip_log {
        ~/health$ 1;
        default 0;
    }
    access_log /var/log/nginx/access.log main if=$skip_log;

    # ============================================================
    # PERFORMANCE TUNING
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/javascript application/xml+rss 
               application/json application/atom+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_proxied any;

    # ============================================================
    # RATE LIMITING
    # ============================================================
    # Rate limiting zones (for multiple endpoints)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ============================================================
    # CACHING CONFIGURATION
    # ============================================================
    # Proxy cache for backend responses
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=backend_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;
    
    # Cache key configuration
    map $request_method $skip_cache {
        default 1;
        GET 0;
        HEAD 0;
    }

    # ============================================================
    # UPSTREAM SERVERS (Backend Services)
    # ============================================================
    
    # Mini Transaction Ledger Backend
    upstream ledger_backend {
        least_conn;  # Use least connections load balancing
        server backend:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Mini Transaction Ledger Frontend
    upstream ledger_frontend {
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================================
    # SECURITY HEADERS
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # CSP (Content Security Policy) - Adjust as needed
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # ============================================================
    # HTTP REDIRECT TO HTTPS
    # ============================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
            autoindex on;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # Health check endpoint (no redirect)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ============================================================
    # HTTPS SERVER (Mini Transaction Ledger)
    # ================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl;
        http2 on;

        server_name ledger.saifullahmnsur.dev www.ledger.saifullahmnsur.dev;

        # ========================================================
        # SSL CONFIGURATION
        # ========================================================
        ssl_certificate /etc/letsencrypt/live/ledger.saifullahmnsur.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ledger.saifullahmnsur.dev/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ========================================================
        # SECURITY HEADERS (HTTPS only)
        # ========================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ========================================================
        # ROOT PATH
        # ========================================================
        root /var/www/html;
        index index.html;

        # ========================================================
        # FRONTEND ROUTES (React app)
        # ========================================================
        location / {
            # Rate limiting
            limit_req zone=general_limit burst=50 nodelay;
            limit_conn addr 10;
            
            # Cache HTML files (1 hour)
            proxy_cache backend_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout invalid_header updating;
            add_header X-Cache-Status $upstream_cache_status;
            
            # Frontend proxy
            proxy_pass http://ledger_frontend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ========================================================
        # API ROUTES (Backend)
        # ========================================================
        location /api/ {
            # Rate limiting - stricter for API
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr 10;
            
            # Backend proxy
            proxy_pass http://ledger_backend/;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Caching (API responses)
            proxy_cache backend_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ========================================================
        # STATIC ASSETS (JS, CSS, Images, Fonts)
        # ========================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # Rate limiting - generous for static assets
            limit_req zone=general_limit burst=100 nodelay;
            
            # Cache static assets for 1 year (immutable)
            proxy_pass http://ledger_frontend;
            proxy_cache backend_cache;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================================
        # HEALTH CHECK ENDPOINT
        # ========================================================
        location /health {
            access_log off;
            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========================================================
        # DENY ACCESS TO SENSITIVE FILES
        # ========================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ================================================================
    # ADDITIONAL SERVERS SECTION (For future multi-app setup)
    # ================================================================
    # To host multiple applications, use path-based routing:
    # 
    # Example: Host "myapp" on /myapp path
    # location /myapp/ {
    #     proxy_pass http://myapp_backend/;
    #     proxy_set_header X-Script-Name /myapp;
    # }
    #
    # Or use subdomain-based routing:
    # server {
    #     server_name myapp.example.com;
    #     # ... SSL config ...
    #     location / {
    #         proxy_pass http://myapp_backend;
    #     }
    # }
    #
    # This setup allows you to:
    # 1. Run multiple applications on the same VM
    # 2. Share the same SSL certificate
    # 3. Share the same Nginx instance
    # 4. Manage everything from one nginx.conf

    # ================================================================
    # STATUS ENDPOINT (Nginx Stats)
    # ================================================================
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}

# ================================================================
# CONFIGURATION NOTES
# ================================================================
#
# 1. UPDATE THESE VALUES:
#    - Replace "ledger.example.com" with your actual domain
#    - Update SSL certificate paths if different
#
# 2. MULTI-SERVER SETUP:
#    To host multiple applications on same VM:
#    
#    Option A: Path-based routing (shared domain)
#      - ledger.example.com/
#      - ledger.example.com/myapp/
#      
#    Option B: Subdomain routing (separate domains)
#      - ledger.example.com (Mini Transaction Ledger)
#      - myapp.ledger.example.com (Another app)
#
# 3. RESOURCE OPTIMIZATION:
#    - worker_processes set to auto (CPU cores)
#    - worker_connections set to 1024 (adjust if needed)
#    - Gzip enabled to reduce bandwidth
#    - Caching configured for performance
#
# 4. SECURITY FEATURES:
#    - HTTPS only (HTTP redirects to HTTPS)
#    - HSTS enabled (force HTTPS)
#    - Security headers added
#    - Rate limiting on API and general traffic
#    - Sensitive file access blocked
#
# 5. PERFORMANCE FEATURES:
#    - Proxy caching for API responses
#    - Static asset caching (1 year)
#    - Gzip compression enabled
#    - Keepalive connections
#    - Least-conn load balancing
#
# 6. HEALTH CHECK:
#    - /health endpoint routed to backend
#    - No logging for health checks (reduce log spam)
#
# 7. TESTING:
#    To validate syntax:
#      docker exec ledger-nginx nginx -t
#    
#    To reload config:
#      docker exec ledger-nginx nginx -s reload
#
# ================================================================