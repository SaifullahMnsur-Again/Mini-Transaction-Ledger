worker_processes auto;

events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    server_tokens off;

    # Docker's internal DNS resolver.
    #
    # Variables are used in proxy_pass so Nginx does not require
    # backend-prod/backend-staging to exist when Nginx starts.
    resolver 127.0.0.11 valid=10s ipv6=off;


    # ============================================================
    # LOGGING
    # ============================================================

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;


    # ============================================================
    # HTTP - STAGING
    # ============================================================

    server {
        listen 80;

        server_name
            staging.ledger.saifullahmnsur.dev
            www.staging.ledger.saifullahmnsur.dev;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot/staging;
        }

        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # ============================================================
    # HTTP - PRODUCTION
    # ============================================================

    server {
        listen 80;

        server_name
            ledger.saifullahmnsur.dev
            www.ledger.saifullahmnsur.dev;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot/prod;
        }

        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # ============================================================
    # DEFAULT HTTP SERVER
    # ============================================================

    server {
        listen 80 default_server;

        server_name _;

        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 444;
        }
    }


    # ============================================================
    # HTTPS - STAGING
    # ============================================================

    server {
        listen 443 ssl http2;

        server_name
            staging.ledger.saifullahmnsur.dev
            www.staging.ledger.saifullahmnsur.dev;

        ssl_certificate
            /etc/letsencrypt/staging/live/staging.ledger.saifullahmnsur.dev/fullchain.pem;

        ssl_certificate_key
            /etc/letsencrypt/staging/live/staging.ledger.saifullahmnsur.dev/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20M;


        # --------------------------------------------------------
        # STAGING API
        # --------------------------------------------------------

        location /api/ {

            set $staging_backend backend-staging;

            proxy_pass http://$staging_backend:8080/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }


        # --------------------------------------------------------
        # STAGING HEALTH
        # --------------------------------------------------------

        location = /health {

            set $staging_backend backend-staging;

            proxy_pass http://$staging_backend:8080/health;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # STAGING FRONTEND
        # --------------------------------------------------------

        location / {

            set $staging_frontend frontend-staging;

            proxy_pass http://$staging_frontend:3000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 60s;
        }
    }


    # ============================================================
    # HTTPS - PRODUCTION
    # ============================================================

    server {
        listen 443 ssl http2;

        server_name
            ledger.saifullahmnsur.dev
            www.ledger.saifullahmnsur.dev;

        ssl_certificate
            /etc/letsencrypt/prod/live/ledger.saifullahmnsur.dev/fullchain.pem;

        ssl_certificate_key
            /etc/letsencrypt/prod/live/ledger.saifullahmnsur.dev/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20M;


        # --------------------------------------------------------
        # PRODUCTION API
        # --------------------------------------------------------

        location /api/ {

            set $production_backend backend-prod;

            proxy_pass http://$production_backend:8080/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }


        # --------------------------------------------------------
        # PRODUCTION HEALTH
        # --------------------------------------------------------

        location = /health {

            set $production_backend backend-prod;

            proxy_pass http://$production_backend:8080/health;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # --------------------------------------------------------
        # PRODUCTION FRONTEND
        # --------------------------------------------------------

        location / {

            set $production_frontend frontend-prod;

            proxy_pass http://$production_frontend:3000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 60s;
        }
    }


    # ============================================================
    # LOCAL NGINX STATUS / HEALTH
    # ============================================================

    server {

        listen 127.0.0.1:8081;

        server_name localhost;

        location = /health {
            access_log off;

            return 200 "NGINX OK\n";

            add_header Content-Type text/plain;
        }
    }
}