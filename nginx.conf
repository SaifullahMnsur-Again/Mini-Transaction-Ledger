# ================================================================
# NGINX CONFIGURATION - MINI TRANSACTION LEDGER
# ================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ================================================================
# EVENTS BLOCK - Connection handling
# ================================================================
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# ================================================================
# HTTP BLOCK - Core settings
# ================================================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # LOGGING CONFIGURATION
    # ============================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    
    map $request_uri $skip_log {
        ~/health$ 1;
        default 0;
    }
    access_log /var/log/nginx/access.log main if=$skip_log;

    # ============================================================
    # PERFORMANCE TUNING
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/javascript application/xml+rss 
               application/json application/atom+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_proxied any;

    # ============================================================
    # RATE LIMITING
    # ============================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ============================================================
    # CACHING CONFIGURATION
    # ============================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=backend_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;
    
    map $request_method $skip_cache {
        default 1;
        GET 0;
        HEAD 0;
    }

    # ============================================================
    # UPSTREAM SERVERS - STAGING BACKENDS
    # ================================================================
    upstream ledger_backend_staging {
        least_conn;
        server backend-staging:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ledger_frontend_staging {
        server frontend-staging:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================================
    # UPSTREAM SERVERS - PRODUCTION BACKENDS
    # ================================================================
    upstream ledger_backend_prod {
        least_conn;
        server backend-prod:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ledger_frontend_prod {
        server frontend-prod:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================================
    # SECURITY HEADERS
    # ================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # ================================================================
    # HTTP REDIRECT (Port 80) - HANDLES BOTH STAGING & PRODUCTION
    # ================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
            autoindex on;
        }

        # Redirect everything to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ================================================================
    # HTTPS SERVER - STAGING
    # ================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        
        server_name staging.ledger.saifullahmnsur.dev www.staging.ledger.saifullahmnsur.dev;

        ssl_certificate /etc/letsencrypt/live/staging.ledger.saifullahmnsur.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.ledger.saifullahmnsur.dev/privkey.pem;
        
        # ============================================================
        # SSL CONFIGURATION - SAME FOR BOTH
        # ================================================================
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        root /var/www/html;
        index index.html;

        # ============================================================
        # FRONTEND - STAGING
        # ============================================================
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            limit_conn addr 10;
            
            proxy_cache backend_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout invalid_header updating;
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_pass http://ledger_frontend_staging;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # API - STAGING
        # ============================================================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://ledger_backend_staging/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_cache backend_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # STATIC ASSETS - STAGING
        # ================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            limit_req zone=general_limit burst=100 nodelay;
            
            proxy_pass http://ledger_frontend_staging;
            proxy_cache backend_cache;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # HEALTH CHECK - STAGING
        # ================================================================
        location /health {
            access_log off;
            proxy_pass http://ledger_backend_staging;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ============================================================
        # DENY SENSITIVE FILES - STAGING
        # ================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ================================================================
    # HTTPS SERVER - PRODUCTION
    # ================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        
        server_name ledger.saifullahmnsur.dev www.ledger.saifullahmnsur.dev;

        ssl_certificate /etc/letsencrypt/live/ledger.saifullahmnsur.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ledger.saifullahmnsur.dev/privkey.pem;
        
        # ============================================================
        # SSL CONFIGURATION - SAME FOR BOTH
        # ================================================================
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        root /var/www/html;
        index index.html;

        # ============================================================
        # FRONTEND - PRODUCTION
        # ============================================================
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            limit_conn addr 10;
            
            proxy_cache backend_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout invalid_header updating;
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_pass http://ledger_frontend_prod;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # API - PRODUCTION
        # ================================================================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://ledger_backend_prod/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_cache backend_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # STATIC ASSETS - PRODUCTION
        # ================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            limit_req zone=general_limit burst=100 nodelay;
            
            proxy_pass http://ledger_frontend_prod;
            proxy_cache backend_cache;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # HEALTH CHECK - PRODUCTION
        # ✅ SAME PATTERN, DIFFERENT UPSTREAM
        # ================================================================
        location /health {
            access_log off;
            proxy_pass http://ledger_backend_prod;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ============================================================
        # DENY SENSITIVE FILES - PRODUCTION
        # ================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ================================================================
    # STATUS ENDPOINT (Nginx Stats)
    # ================================================================
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}