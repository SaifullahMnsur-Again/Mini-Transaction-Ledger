services:

  # ============================================================
  # SHARED NGINX
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ledger-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

      # Staging certificates
      - ./ssl-staging:/etc/letsencrypt/staging:ro

      # Production certificates
      - ./ssl-prod:/etc/letsencrypt/prod:ro

      # Certbot challenge directories
      - ./certbot-www-staging:/var/www/certbot/staging:ro
      - ./certbot-www-prod:/var/www/certbot/prod:ro

      - nginx_cache:/var/cache/nginx

    networks:
      - ledger-net-staging
      - ledger-net-prod

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"


  # ============================================================
  # SHARED CERTBOT
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: ledger-certbot
    restart: unless-stopped

    volumes:
      # Staging Let's Encrypt data
      - ./ssl-staging:/etc/letsencrypt/staging:rw

      # Production Let's Encrypt data
      - ./ssl-prod:/etc/letsencrypt/prod:rw

      # ACME challenge directories
      - ./certbot-www-staging:/var/www/certbot/staging:rw
      - ./certbot-www-prod:/var/www/certbot/prod:rw

    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM

        while :; do

          echo "========================================"
          echo "Checking STAGING certificates..."
          echo "========================================"

          certbot renew \
            --config-dir /etc/letsencrypt/staging \
            --work-dir /var/lib/letsencrypt/staging \
            --logs-dir /var/log/letsencrypt/staging \
            --webroot-path /var/www/certbot/staging \
            --quiet || true


          echo "========================================"
          echo "Checking PRODUCTION certificates..."
          echo "========================================"

          certbot renew \
            --config-dir /etc/letsencrypt/prod \
            --work-dir /var/lib/letsencrypt/prod \
            --logs-dir /var/log/letsencrypt/prod \
            --webroot-path /var/www/certbot/prod \
            --quiet || true


          echo "Certificate renewal check completed."

          sleep 12h &
          wait $${!}

        done

    networks:
      - ledger-net-staging
      - ledger-net-prod

    depends_on:
      - nginx

    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"


# ============================================================
# VOLUMES
# ============================================================
volumes:
  nginx_cache:
    driver: local


# ============================================================
# NETWORKS
# ============================================================
networks:

  ledger-net-staging:
    external: true

  ledger-net-prod:
    external: true