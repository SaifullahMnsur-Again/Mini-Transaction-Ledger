services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ledger_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - ledger-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: ledger-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-ledger_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8000:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - ledger-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: ledger-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - ledger-net

volumes:
  postgres_data:
    driver: local

networks:
  ledger-net:
    driver: bridge