name: mini-transaction-ledger-staging

services:

  # ============================================================
  # STAGING DATABASE
  # ============================================================
  postgres-db-staging:
    image: postgres:16-alpine
    container_name: ledger-db-staging
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_staging}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data_staging:/var/lib/postgresql/data

    networks:
      - ledger-net-staging

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ledger_staging}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ============================================================
  # STAGING BACKEND
  # ============================================================
  backend-staging:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}

    container_name: ledger-backend-staging
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      DOTNET_RUNNING_IN_CONTAINER: "true"

      ConnectionStrings__DefaultConnection: >-
        Host=postgres-db-staging;
        Port=5432;
        Database=${POSTGRES_DB:-ledger_staging};
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD:-postgres}

      ASPNETCORE_URLS: http://+:8080

    expose:
      - "8080"

    networks:
      - ledger-net-staging

    depends_on:
      postgres-db-staging:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ============================================================
  # STAGING FRONTEND
  # ============================================================
  frontend-staging:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}

    container_name: ledger-frontend-staging
    restart: unless-stopped

    environment:
      NODE_ENV: staging
      REACT_APP_API_URL: https://staging.ledger.saifullahmnsur.dev/api

    expose:
      - "3000"

    networks:
      - ledger-net-staging

    depends_on:
      backend-staging:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data_staging:
    external: true
    name: mini-transaction-ledger_postgres_data_staging


# ============================================================
# NETWORK
# ============================================================
networks:
  ledger-net-staging:
    external: true
    name: ledger-net-staging