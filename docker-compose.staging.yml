services:
  nginx:
    image: nginx:1.25-alpine
    container_name: ledger-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl-staging:/etc/letsencrypt:ro
      - ./certbot-www-staging:/var/www/certbot:ro
    depends_on:
      - backend-staging
      - frontend-staging
    networks:
      - ledger-net-staging

  postgres-db-staging:
    image: postgres:16-alpine
    container_name: ledger-db-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_staging}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - ledger-net-staging

  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledger-backend-staging
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ConnectionStrings__DefaultConnection=Host=postgres-db-staging;Port=5432;Database=${POSTGRES_DB:-ledger_staging};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ASPNETCORE_URLS=http://+:8080
    expose:
      - "8080"
    networks:
      - ledger-net-staging
    depends_on:
      postgres-db-staging:
        condition: service_healthy

  frontend-staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledger-frontend-staging
    environment:
      - NODE_ENV=staging
      - REACT_APP_API_URL=https://staging.ledger.saifullahmnsur.dev/api
    expose:
      - "3000"
    networks:
      - ledger-net-staging
    depends_on:
      backend-staging:
        condition: service_healthy

volumes:
  postgres_data_staging:
    driver: local

networks:
  ledger-net-staging:
    driver: bridge