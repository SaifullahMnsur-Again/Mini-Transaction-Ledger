name: Deploy to Staging

# ================================================================
# ADAPTED FROM: Original deploy.yml
# ================================================================

on:
  push:
    branches:
      - devops-develop 

  workflow_dispatch:
    inputs:
      deploy_message:
        description: "Deployment message"
        required: false
        default: "Manual staging deployment"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: saifullahmnsur-again/mini-transaction-ledger/backend
  IMAGE_NAME_FRONTEND: saifullahmnsur-again/mini-transaction-ledger/frontend
  COMPOSE_FILE: docker-compose.staging.yml
  ENVIRONMENT: staging

# ---------------------------------------------------------
# BUILD BACKEND
# ---------------------------------------------------------
jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout devops-develop
        uses: actions/checkout@v4
        with:
          ref: devops-develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------------------------------------------------
# BUILD FRONTEND - SAME AS ORIGINAL
# ---------------------------------------------------------
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout devops-develop
        uses: actions/checkout@v4
        with:
          ref: devops-develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------------------------------------------------
# SECURITY SCAN
# ---------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:staging-${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: backend-ledger-api-staging

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:staging-${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: frontend-ledger-ui-staging


# ---------------------------------------------------------
# DEPLOY TO STAGING
# ---------------------------------------------------------
  deploy:
    name: Deploy to Staging

    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend
      - security-scan

    if: |
      github.ref == 'refs/heads/devops-develop'

    permissions:
      contents: read
      packages: read

    environment:
      name: staging

    steps:
      - name: Checkout devops-develop
        uses: actions/checkout@v4
        with:
          ref: devops-develop

      - name: Install SSH key
        env:
          AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$AZURE_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add Azure VM to known_hosts
        env:
          VM_IP: ${{ secrets.AZURE_VM_IP }}
        run: |
          set -e
          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        env:
          VM_APP_PATH: ${{ secrets.VM_APP_PATH }}
          VM_USERNAME: ${{ secrets.AZURE_VM_USERNAME }}
          VM_IP: ${{ secrets.AZURE_VM_IP }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}

          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}

          IMAGE_TAG: staging-${{ github.sha }}

        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            "${VM_USERNAME}@${VM_IP}" \
            "VM_APP_PATH='${VM_APP_PATH}' \
             GHCR_USERNAME='${GHCR_USERNAME}' \
             GHCR_TOKEN='${GHCR_TOKEN}' \
             BACKEND_IMAGE='${BACKEND_IMAGE}' \
             FRONTEND_IMAGE='${FRONTEND_IMAGE}' \
             IMAGE_TAG='${IMAGE_TAG}' \
             STAGING_DOMAIN='${STAGING_DOMAIN}' \
             COMPOSE_FILE='${{ env.COMPOSE_FILE }}' \
             bash -s" << 'DEPLOY_SCRIPT'

          set -e

          APP_PATH="${VM_APP_PATH}"
          BRANCH="devops-develop"
          COMPOSE_FILE="${COMPOSE_FILE:-docker-compose.staging.yml}"

          echo "========================================"
          echo "Starting STAGING deployment"
          echo "========================================"

          echo "Application path: ${APP_PATH}"
          echo "Branch: ${BRANCH}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Compose file: ${COMPOSE_FILE}"

          cd "$APP_PATH"

          if [ ! -d ".git" ]; then
            echo "ERROR: ${APP_PATH} is not a Git repository."
            exit 1
          fi

          echo "Fetching ${BRANCH}..."
          git fetch origin "${BRANCH}"

          echo "Resetting working tree to origin/${BRANCH}..."
          git reset --hard "origin/${BRANCH}"

          echo "Cleaning untracked deployment files..."
          git clean -fd \
            -e ssl/ \
            -e certbot-www/ \
            -e ssl-staging/ \
            -e certbot-www-staging/ \
            -e .env

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "ERROR: ${COMPOSE_FILE} not found."
            exit 1
          fi

          mkdir -p ssl-staging certbot-www-staging

          echo "Current deployed commit:"
          git rev-parse HEAD

          echo "Docker image tag:"
          echo "${IMAGE_TAG}"

          echo "Logging in to GHCR..."
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GHCR_USERNAME" \
            --password-stdin

          echo "Pulling backend image..."
          docker pull "${BACKEND_IMAGE}:${IMAGE_TAG}"

          echo "Pulling frontend image..."
          docker pull "${FRONTEND_IMAGE}:${IMAGE_TAG}"

          docker image inspect "${BACKEND_IMAGE}:${IMAGE_TAG}" > /dev/null
          docker image inspect "${FRONTEND_IMAGE}:${IMAGE_TAG}" > /dev/null

          echo "Docker images successfully pulled."

          echo "Validating Docker Compose configuration..."

          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose \
            -f "$COMPOSE_FILE" \
            config -q

          echo "Resolved Docker images:"
          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose \
            -f "$COMPOSE_FILE" \
            config --images

          echo "Deploying STAGING containers..."

          BACKEND_IMAGE="$BACKEND_IMAGE" \
          FRONTEND_IMAGE="$FRONTEND_IMAGE" \
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose \
            -f "$COMPOSE_FILE" \
            up -d \
            --no-build \
            --remove-orphans

          echo "Container status:"
          docker compose \
            -f "$COMPOSE_FILE" \
            ps

          echo "Waiting for services to become healthy..."
          sleep 10

          HEALTH_CHECK_PASSED=0

          for i in $(seq 1 30); do
            BACKEND_OK=0
            FRONTEND_OK=0
            DATABASE_OK=0

            if docker compose \
              -f "$COMPOSE_FILE" \
              exec -T backend-staging \
              curl -fsS \
              http://localhost:8080/health \
              > /dev/null 2>&1; then
              BACKEND_OK=1
            fi

            if docker compose \
              -f "$COMPOSE_FILE" \
              exec -T frontend-staging \
              wget --spider -q \
              http://localhost:3000 \
              > /dev/null 2>&1; then
              FRONTEND_OK=1
            fi

            if docker compose \
              -f "$COMPOSE_FILE" \
              exec -T postgres-db-staging \
              pg_isready \
              -U postgres \
              > /dev/null 2>&1; then
              DATABASE_OK=1
            fi

            echo "Health check ${i}/30:"
            echo "  Backend:   ${BACKEND_OK}"
            echo "  Frontend:  ${FRONTEND_OK}"
            echo "  PostgreSQL:${DATABASE_OK}"

            if [ "$BACKEND_OK" -eq 1 ] && \
               [ "$FRONTEND_OK" -eq 1 ] && \
               [ "$DATABASE_OK" -eq 1 ]; then

              echo "========================================"
              echo "All STAGING services are healthy."
              echo "========================================"

              HEALTH_CHECK_PASSED=1
              break
            fi

            sleep 2
          done

          if [ "$HEALTH_CHECK_PASSED" -ne 1 ]; then
            echo "ERROR: STAGING application health checks failed."

            echo "Container status:"
            docker compose \
              -f "$COMPOSE_FILE" \
              ps

            echo "Container logs:"
            docker compose \
              -f "$COMPOSE_FILE" \
              logs \
              --tail=200

            exit 1
          fi

          echo "Validating Nginx configuration..."

          if ! docker exec ledger-nginx nginx -t; then
            echo "ERROR: Nginx configuration validation failed."
            exit 1
          fi

          echo "Nginx configuration is valid."

          echo "Checking STAGING HTTPS endpoint..."

          if curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            "https://${STAGING_DOMAIN}/health" \
            > /dev/null; then

            echo "STAGING HTTPS health endpoint is responding."

          else
            echo "ERROR: STAGING HTTPS health check failed."

            docker compose \
              -f "$COMPOSE_FILE" \
              ps

            exit 1
          fi

          docker logout ghcr.io || true

          echo "========================================"
          echo "STAGING deployment completed successfully."
          echo "========================================"

          DEPLOY_SCRIPT

      - name: Verify Staging HTTPS
        env:
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -e

          echo "Verifying STAGING HTTPS endpoint..."
          echo "Checking: https://${STAGING_DOMAIN}/health"

          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --location \
            --max-time 30 \
            "https://${STAGING_DOMAIN}/health" \
            > /dev/null

          echo "✓ STAGING HTTPS endpoint is fully accessible and healthy!"

      - name: Staging deployment summary
        env:
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          echo "========================================"
          echo "STAGING Deployment Summary"
          echo "========================================"
          echo "Branch:    devops-develop"
          echo "Commit:    ${{ github.sha }}"
          echo "Domain:    https://${STAGING_DOMAIN}"
          echo "Backend:   ${REGISTRY}/${IMAGE_NAME_BACKEND}:staging-${{ github.sha }}"
          echo "Frontend:  ${REGISTRY}/${IMAGE_NAME_FRONTEND}:staging-${{ github.sha }}"
          echo "========================================"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key