name: Deploy MiniTransactionLedger to Azure VM (devops-pipeline)

on:
  push:
    branches: [ "devops-pipeline" ]
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ==========================================
  # Build Backend
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./Backend
      run: dotnet restore "Backend.csproj"

    - name: Build backend
      working-directory: ./Backend
      run: dotnet build "Backend.csproj" -c Release --no-restore

    - name: Run unit tests
      working-directory: ./Backend
      run: dotnet test "Backend.csproj" -c Release --no-build --verbosity normal || true

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Backend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==========================================
  # Build Frontend
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint code
      working-directory: ./frontend
      run: npm run lint || true

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==========================================
  # Security Scanning
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner on backend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-backend.sarif'

    - name: Run Trivy vulnerability scanner on frontend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-frontend.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-*.sarif'

  # ==========================================
  # Deploy to Azure VM
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, security-scan]
    environment:
      name: production
      url: https://${{ secrets.PRODUCTION_DOMAIN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.AZURE_SSH_KEY }}

    - name: Deploy to Azure VM
      env:
        VM_IP: ${{ secrets.AZURE_VM_IP }}
        VM_USER: ${{ secrets.AZURE_VM_USERNAME }}
        VM_PATH: ${{ secrets.VM_APP_PATH }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts

        ssh "$VM_USER@$VM_IP" << 'EOF'
          set -e
          
          cd "${{ env.VM_PATH }}"
          
          # Create backup
          BACKUP_DIR="backups/$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          docker compose -f docker-compose.yml logs > "$BACKUP_DIR/logs.txt" 2>&1 || true
          
          # Pull latest code
          git fetch origin devops-pipeline
          git reset --hard origin/devops-pipeline
          
          # Set environment
          cat > .env << 'ENVEOF'
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          ASPNETCORE_ENVIRONMENT=Production
          NODE_ENV=production
          DOMAIN=${{ secrets.PRODUCTION_DOMAIN }}
          ENVEOF
          
          # Deploy
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose.yml up -d --build --remove-orphans
          
          # Health checks
          echo "⏳ Waiting for services to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health > /dev/null 2>&1 && \
               curl -f http://localhost/health > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              docker compose -f docker-compose.yml ps
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          echo "❌ Health check failed - rolling back"
          docker compose -f docker-compose.yml down
          exit 1
        EOF

    - name: Notify on Success
      if: success()
      run: echo "✅ Deployment to ${{ secrets.PRODUCTION_DOMAIN }} completed successfully!"

    - name: Notify on Failure
      if: failure()
      run: echo "❌ Deployment failed - check logs"