name: mini-transaction-ledger-production

services:

  # ============================================================
  # PRODUCTION DATABASE
  # ============================================================
  postgres-db-prod:
    image: postgres:16-alpine
    container_name: ledger-db-prod
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_prod}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

    networks:
      - ledger-net-prod

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ledger_prod}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ============================================================
  # PRODUCTION BACKEND
  # ============================================================
  backend-prod:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}

    container_name: ledger-backend-prod
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_RUNNING_IN_CONTAINER: "true"

      ConnectionStrings__DefaultConnection: >-
        Host=postgres-db-prod;
        Port=5432;
        Database=${POSTGRES_DB:-ledger_prod};
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD:-postgres}

      ASPNETCORE_URLS: http://+:8080

    expose:
      - "8080"

    networks:
      - ledger-net-prod

    depends_on:
      postgres-db-prod:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ============================================================
  # PRODUCTION FRONTEND
  # ============================================================
  frontend-prod:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}

    container_name: ledger-frontend-prod
    restart: unless-stopped

    environment:
      NODE_ENV: production
      REACT_APP_API_URL: https://ledger.saifullahmnsur.dev/api

    expose:
      - "3000"

    networks:
      - ledger-net-prod

    depends_on:
      backend-prod:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data_prod:
    driver: local


# ============================================================
# NETWORK
# ============================================================
networks:
  ledger-net-prod:
    name: ledger-net-prod
    driver: bridge